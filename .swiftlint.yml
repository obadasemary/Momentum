included:
  - Packages
  - MomentumApp/Sources

excluded:
  - Packages/Core/Tests
  - Packages/Domain/Tests
  - Packages/Data/Tests
  - Packages/Presentation/Tests
  - MomentumApp/Tests

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - let_var_whitespace
  - literal_expression_end_indentation
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_imports
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

disabled_rules:
  - todo
  - trailing_whitespace

line_length:
  warning: 120
  error: 150
  ignores_function_declarations: true
  ignores_comments: true

file_length:
  warning: 300
  error: 500

type_body_length:
  warning: 200
  error: 300

function_body_length:
  warning: 40
  error: 60
