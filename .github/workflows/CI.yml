name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spm-tests:
    name: SPM Tests (${{ matrix.package }})
    runs-on: macos-26
    strategy:
      matrix:
        package: [Core, Domain, Data, Presentation]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Test ${{ matrix.package }}
        run: swift test --package-path Packages/${{ matrix.package }}

  xcode-build-test:
    name: Xcode Build & Test
    runs-on: macos-26
    needs: spm-tests
    timeout-minutes: 30
    env:
      DESTINATION: 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest'
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen
      - name: Build
        run: |
          xcodebuild \
            -project MomentumApp/MomentumApp.xcodeproj \
            -scheme Momentum \
            -destination "$DESTINATION" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build
      - name: Unit Tests
        run: |
          xcodebuild test \
            -project MomentumApp/MomentumApp.xcodeproj \
            -scheme Momentum \
            -destination "$DESTINATION" \
            -only-testing:MomentumTests \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=YES
      - name: Upload Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: ~/Library/Developer/Xcode/DerivedData/Momentum-*/Logs/Test/
          retention-days: 7
